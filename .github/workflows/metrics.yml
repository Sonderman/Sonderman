name: Generate metrics cards

on:
  schedule: # every 12 hours, offset from the snake workflow
    - cron: "30 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: stats + top languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sonderman
          filename: metrics.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update metrics.svg"
          config_timezone: Europe/Istanbul
          config_display: medium
          config_octicon: yes
          base: community, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

      - name: contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sonderman
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "Update metrics-calendar.svg"
          config_timezone: Europe/Istanbul
          config_display: large
          config_octicon: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
